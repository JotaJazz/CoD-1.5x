<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CoD 1.5x</title>
  <desc id="desc">Client-side upgrade for Call of Duty 1.5 multiplayer: native widescreen, Hor+ FOV, raw mouse input, safer downloads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f14"/>
      <stop offset="0.55" stop-color="#2a3120"/>
      <stop offset="1" stop-color="#14170f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#c8a24a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8a24a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e8e2c8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d27a"/>
      <stop offset="1" stop-color="#b8892e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- military star (vehicle insignia style) -->
  <g transform="translate(985 150)">
    <circle r="112" fill="none" stroke="#e8e2c8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 10"/>
    <circle r="96" fill="none" stroke="#e8e2c8" stroke-opacity="0.85" stroke-width="7"/>
    <polygon points="0.0,-88.0 19.8,-27.2 83.7,-27.2 32.0,10.4 51.7,71.2 0.0,33.6 -51.7,71.2 -32.0,10.4 -83.7,-27.2 -19.8,-27.2" fill="#e8e2c8" fill-opacity="0.85"/>
  </g>

  <!-- 16:9 frame hint -->
  <g stroke="#c8a24a" stroke-width="3" fill="none" stroke-opacity="0.8">
    <path d="M40 60V40H60M40 240V260H60M760 40H780V60M760 260H780V240"/>
  </g>

  <text x="70" y="148" font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-size="96" letter-spacing="4" fill="#e8e2c8">CoD <tspan fill="url(#gold)">1.5x</tspan></text>
  <text x="74" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="2" fill="#e8e2c8" fill-opacity="0.85">CLIENT UPGRADE FOR CALL OF DUTY 1.5 MULTIPLAYER</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1b1f14">
    <rect x="72" y="214" width="150" height="30" rx="4" fill="#c8a24a"/>
    <text x="147" y="234" text-anchor="middle">NATIVE 16:9</text>
    <rect x="234" y="214" width="120" height="30" rx="4" fill="#c8a24a"/>
    <text x="294" y="234" text-anchor="middle">HOR+ FOV</text>
    <rect x="366" y="214" width="130" height="30" rx="4" fill="#c8a24a"/>
    <text x="431" y="234" text-anchor="middle">RAW INPUT</text>
    <rect x="508" y="214" width="170" height="30" rx="4" fill="#c8a24a"/>
    <text x="593" y="234" text-anchor="middle">SAFE DOWNLOADS</text>
  </g>
</svg>
